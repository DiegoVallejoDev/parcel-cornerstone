<div x-data="{
        status: null,
        loading: true,
        error: false,
        async fetchStatus() {
            try {
                // Simulated fetch for demo
                // const res = await fetch('/api/status');
                // this.status = await res.json();
                this.status = { cpu: Math.floor(Math.random() * 100), status: 'operational', time: Date.now() };
                this.error = false;
            } catch (e) {
                console.error('[Dashboard] Fetch failed', e);
                this.error = true;
            } finally {
                this.loading = false;
            }
        },
        init() {
            this.fetchStatus();
            setInterval(() => this.fetchStatus(), 2000);
        }
    }" class="rounded" role="region" aria-label="{{ ui.dashboard.title }}">

    <template x-if="loading">
        <div class="h-32 flex items-center justify-center bg-gray-50 dark:bg-gray-700 rounded-lg animate-pulse">
            <span class="text-gray-400 text-sm">Loading Status...</span>
        </div>
    </template>

    <template x-if="!loading && status">
        <div class="p-6 border rounded-lg shadow-sm bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-700 dark:text-gray-200">{{ ui.dashboard.title }}</h3>
                <span
                    class="px-2 py-1 rounded text-xs font-mono bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                    API: /api/status
                </span>
            </div>

            <div class="flex items-center gap-4 mb-4">
                <span class="relative flex h-3 w-3">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-green-400"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-3xl font-bold text-gray-900 dark:text-gray-100" x-text="status.cpu + '%'"></span>
                <span class="text-sm text-gray-500">{{ ui.dashboard.load }}</span>
            </div>

            <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5 mb-4">
                <div class="h-2.5 rounded-full transition-all duration-500"
                    :class="status.cpu > 80 ? 'bg-red-500' : 'bg-blue-600'" :style="'width: ' + status.cpu + '%'">
                </div>
            </div>
        </div>
    </template>
</div>
