<include src="templates/components/navbar.html"></include>

<main id="main-content" class="flex-1 max-w-4xl w-full mx-auto mt-10 p-6 space-y-6 stagger" role="main">
    <header class="card p-8">
        <h1 class="text-3xl heading-gradient">
            {{ ui.blog.title }}
        </h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2">{{ ui.blog.subtitle }}</p>
    </header>

    <each loop="post in posts">
        <article class="card-hover p-6">
            <a href="{{ post.url }}" class="block group">
                <h2
                    class="text-xl font-semibold group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                    {{ post.title }}
                </h2>
                <if condition="post.description">
                    <p class="text-gray-500 dark:text-gray-400 mt-2 line-clamp-2">{{ post.description }}</p>
                </if>
                <div class="flex items-center gap-3 mt-3 text-sm text-gray-400 dark:text-gray-500">
                    <if condition="post.date">
                        <time class="flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            {{ post.date }}
                        </time>
                    </if>
                    <if condition="post.author">
                        <span class="flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            {{ post.author }}
                        </span>
                    </if>
                </div>
            </a>
        </article>
    </each>
</main>

<include src="templates/components/footer.html"></include>
