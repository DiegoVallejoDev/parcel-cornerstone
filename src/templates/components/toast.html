<div x-data class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
    <template x-for="toast in $store.toasts.items" :key="toast.id">
        <div x-data="toastItem" x-show="show" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-lg rounded-lg p-4 flex items-center gap-3 min-w-[300px]"
            role="alert">

            <div :class="iconColor(toast.type)">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="iconPath(toast.type)" />
                </svg>
            </div>

            <div class="text-sm font-medium text-gray-900 dark:text-gray-100 flex-1">
                <span x-text="toast.message"></span>
            </div>

            <button @click="$store.toasts.remove(toast.id)"
                class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                <span class="sr-only">Close</span>
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </template>
</div>
