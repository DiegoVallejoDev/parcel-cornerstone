<article class="max-w-3xl mx-auto px-4 py-8">
    <header class="mb-8">
        <a href="/" class="text-blue-600 dark:text-blue-400 hover:underline mb-4 inline-block">&larr; Back to Home</a>
        <h1 class="text-4xl font-bold text-gray-900 dark:text-gray-100 mb-2">{{ post.title }}</h1>
        <div class="text-gray-500 dark:text-gray-400 text-sm">
            <span>{{ post.date }}</span> • <span>{{ post.author }}</span>
        </div>
        <div class="mt-4 flex gap-2">
            <each loop="tag in post.tags">
                <span
                    class="inline-block bg-gray-200 dark:bg-gray-700 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 dark:text-gray-300">#{{
                    tag }}</span>
            </each>
        </div>
    </header>

    <div class="prose prose-lg dark:prose-invert max-w-none">
        {{{ post.content }}}
    </div>
</article>

<include src="templates/components/footer.html" />
