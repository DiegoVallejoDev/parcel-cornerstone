<a href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-white focus:text-gray-900 focus:rounded focus:shadow-lg focus:outline-none">
    Skip to content
</a>
<nav x-data="{ open: false }" class="bg-gray-900 text-white sticky top-0 z-40 shadow-md" role="navigation"
    aria-label="{{ ui.nav.main }}">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/"
            class="text-lg font-bold tracking-tight hover:text-gray-300 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-gray-900 rounded">
            {{ ui.title }}
        </a>
        <div class="hidden md:flex items-center gap-6 text-sm">
            <a href="/"
                class="hover:text-gray-300 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded px-1">
                {{ ui.nav.home }}
            </a>
            <a href="#about"
                class="hover:text-gray-300 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded px-1">
                {{ ui.nav.about }}
            </a>
            <div class="flex items-center gap-2 border-l border-gray-700 pl-4" role="group"
                aria-label="{{ ui.nav.language }}">
                <each loop="item in languages">
                    <a href="{{ item.href }}"
                        class="px-2 py-1 rounded text-xs uppercase transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white {{ item.active ? 'bg-white text-gray-900 font-bold' : 'hover:text-gray-300' }}"
                        aria-current="{{ item.active ? 'page' : 'false' }}">
                        {{ item.code }}
                    </a>
                </each>
            </div>
            <button x-on:click="$store.darkMode.toggle()"
                class="p-1.5 rounded-full hover:bg-gray-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white cursor-pointer"
                :aria-label="$store.darkMode.on ? '{{ ui.darkMode.light }}' : '{{ ui.darkMode.dark }}'" role="switch"
                :aria-checked="$store.darkMode.on">
                <svg x-show="!$store.darkMode.on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
                </svg>
                <svg x-show="$store.darkMode.on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m8.66-13.66l-.71.71M4.05 19.95l-.71.71M21 12h-1M4 12H3m16.66 7.66l-.71-.71M4.05 4.05l-.71-.71M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </button>
        </div>
        <button
            class="md:hidden p-1.5 rounded hover:bg-gray-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
            x-on:click="open = !open" :aria-expanded="open" aria-controls="mobile-menu" aria-label="Toggle menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16" />
                <path x-show="open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    <div x-show="open" x-transition id="mobile-menu" class="md:hidden px-4 pb-3 space-y-2 text-sm" role="menu">
        <a href="/"
            class="block hover:text-gray-300 transition-colors py-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded"
            role="menuitem">
            {{ ui.nav.home }}
        </a>
        <a href="#about"
            class="block hover:text-gray-300 transition-colors py-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded"
            role="menuitem">
            {{ ui.nav.about }}
        </a>
        <div class="flex items-center gap-2 border-t border-gray-700 pt-2" role="group"
            aria-label="{{ ui.nav.language }}">
            <span class="text-xs text-gray-400">{{ ui.nav.language }}:</span>
            <each loop="item in languages">
                <a href="{{ item.href }}"
                    class="px-2 py-1 rounded text-xs uppercase transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white {{ item.active ? 'bg-white text-gray-900 font-bold' : 'hover:text-gray-300' }}"
                    aria-current="{{ item.active ? 'page' : 'false' }}">
                    {{ item.code }}
                </a>
            </each>
        </div>
        <button x-on:click="$store.darkMode.toggle()"
            class="block w-full text-left hover:text-gray-300 transition-colors border-t border-gray-700 pt-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded"
            role="menuitem">
            {{ ui.darkMode.toggle }}
        </button>
    </div>
</nav>
