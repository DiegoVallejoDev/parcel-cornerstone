<div x-data="drawer" @keydown.escape.window="open = false">
    <button type="button" @click="open = true" class="btn-secondary">
        {{ ui.services.drawer.open }}
    </button>

    <template x-teleport="body">
        <div
            x-show="open"
            style="display: none"
            class="fixed inset-0 z-[100] overflow-hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="drawer-title"
        >
            <div
                x-show="open"
                x-transition:enter="ease-in-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in-out duration-300"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                class="absolute inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
                @click="open = false"
                aria-hidden="true"
            ></div>

            <div class="fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div
                    x-show="open"
                    x-transition:enter="transform transition ease-in-out duration-300"
                    x-transition:enter-start="translate-x-full"
                    x-transition:enter-end="translate-x-0"
                    x-transition:leave="transform transition ease-in-out duration-300"
                    x-transition:leave-start="translate-x-0"
                    x-transition:leave-end="translate-x-full"
                    class="w-screen max-w-md"
                >
                    <div
                        class="flex h-full flex-col overflow-y-scroll bg-white dark:bg-gray-800 shadow-xl"
                    >
                        <div
                            class="flex items-center justify-between px-4 py-6 sm:px-6"
                        >
                            <h2
                                id="drawer-title"
                                class="text-lg font-medium text-gray-900 dark:text-gray-100"
                            >
                                {{ ui.services.drawer.title }}
                            </h2>
                            <button
                                type="button"
                                @click="open = false"
                                class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300"
                            >
                                <span class="sr-only">Close</span>
                                <svg
                                    class="w-6 h-6"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    aria-hidden="true"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"
                                    />
                                </svg>
                            </button>
                        </div>
                        <div class="relative mt-6 flex-1 px-4 sm:px-6">
                            <p class="text-gray-600 dark:text-gray-400">
                                {{ ui.services.drawer.content }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
