<div x-data="tooltip" class="relative inline-block">
    <button
        type="button"
        @mouseenter="show"
        @mouseleave="hide"
        @focus="show"
        @blur="hide"
        class="btn-secondary"
        aria-describedby="tooltip-demo"
    >
        {{ ui.services.tooltip.button }}
    </button>

    <div
        x-show="visible"
        style="display: none"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 translate-y-1"
        class="absolute z-50 bottom-full left-1/2 mb-2 w-max max-w-xs -translate-x-1/2 rounded bg-gray-900 dark:bg-gray-700 px-3 py-2 text-sm text-white shadow-lg"
        role="tooltip"
        id="tooltip-demo"
    >
        {{ ui.services.tooltip.text }}
    </div>
</div>
